name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (finance maths, booking conflicts, report consolidation)
        run: npm test
      - name: Security rules tests (Firestore emulator)
        run: npm run test:rules
      - name: Build against emulators
        run: npm run build
        env:
          VITE_USE_EMULATORS: 'true'
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-orp.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-orp
          VITE_FIREBASE_APP_ID: demo-app
          VITE_CHURCH_NAME: The Elevation Church · Ijebu Ode
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end workflows (desktop + mobile)
        run: |
          mkdir -p e2e-screenshots
          set -o pipefail
          npx firebase emulators:exec --only auth,firestore --project demo-orp "npm run seed:emulator && npx playwright test" 2>&1 | tee e2e-screenshots/e2e-log.txt
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p e2e-screenshots/failures
          find test-results -name '*.png' 2>/dev/null | while read f; do cp "$f" "e2e-screenshots/failures/$(echo "$f" | tr '/' '_')"; done
          cd e2e-screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Screenshots from ${{ github.sha }} (${{ job.status }})" > README.md
          git add -A && git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

  # Publishes firestore.rules to Firebase after every test passes on main.
  # Needs the FIREBASE_SERVICE_ACCOUNT repository secret (a Firebase service-account JSON key).
  deploy-rules:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Deploy Firestore security rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set, so the rules were NOT published. Add it, or paste firestore.rules into the Firebase console."
            exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')).project_id)")
          npx firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive
          echo "::notice::Firestore rules published to $PROJECT"
          rm -f "$RUNNER_TEMP/sa.json"
